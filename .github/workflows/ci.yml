name: Static Site CI/CD

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    name: Проверка и деплой на Pages
    if: github.ref == 'refs/heads/main' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Проверить структуру сайта
        run: |
          for file in index.html style.css script.js favicon.svg; do
            if [ ! -f "public/$file" ]; then
              echo "❌ Не найден файл: public/$file"
              exit 1
            fi
          done
          grep -q 'style.css' public/index.html || { echo "❌ index.html не подключает style.css"; exit 1; }
          grep -q 'script.js' public/index.html || { echo "❌ index.html не подключает script.js"; exit 1; }
          grep -q 'favicon.svg' public/index.html || { echo "❌ index.html не подключает favicon.svg"; exit 1; }
          echo "✅ Структура сайта в порядке"

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deployment
        uses: actions/deploy-pages@v4

  release:
    name: Публикация релиза
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Создать релиз
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          body: |
            ## Живой сайт

            <https://spleiii.github.io/hello-static/>

            Сайт обновляется автоматически при пуше в `main`. Релиз фиксирует
            состояние на момент тега.